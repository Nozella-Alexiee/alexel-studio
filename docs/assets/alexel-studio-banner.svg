<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1D" />
      <stop offset="50%" stop-color="#101E36" />
      <stop offset="100%" stop-color="#182C4E" />
    </linearGradient>

    <!-- App Icon Card Gradient -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="0%" y2="1">
      <stop offset="0%" stop-color="#233E6B" />
      <stop offset="100%" stop-color="#0E1A2E" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2E4F" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#111D33" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#02050A" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Banner Canvas -->
  <rect width="1200" height="440" rx="28" fill="url(#bgGrad)" />

  <!-- Technical Code / Blueprint Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200" />
    <path d="M70 0 V440 M210 0 V440 M350 0 V440 M490 0 V440 M630 0 V440 M770 0 V440 M910 0 V440 M1050 0 V440 M1190 0 V440" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="1020" cy="110" r="160" fill="#6CC4FF" opacity="0.14" filter="url(#softGlow)" />
  <circle cx="820" cy="360" r="130" fill="#2A75FF" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="160" cy="340" r="140" fill="#FF9A3C" opacity="0.10" filter="url(#softGlow)" />

  <!-- RIGHT HERO CARD: Mascot Penguin & Official App Icon -->
  <g transform="translate(840, 50)" filter="url(#cardShadow)">
    <!-- Container Card Frame -->
    <rect width="290" height="340" rx="24" fill="url(#cardBg)" stroke="#2B4673" stroke-width="1.5" />

    <!-- Penguin App Icon Frame -->
    <g transform="translate(45, 30)">
      <!-- Squircle Base -->
      <rect width="200" height="200" rx="46" fill="url(#iconBg)" stroke="#3B609E" stroke-width="2" />
      <ellipse cx="100" cy="180" rx="58" ry="12" fill="#182A4A" opacity="0.8" />

      <!-- The Official Alexel Penguin -->
      <g transform="translate(100 115) scale(1.3) translate(-60 -78)">
        <!-- Feet -->
        <ellipse cx="45" cy="128" rx="10" ry="5" fill="#FF9A3C" />
        <ellipse cx="75" cy="128" rx="10" ry="5" fill="#FF9A3C" />
        <!-- Flippers -->
        <ellipse cx="22" cy="86" rx="9" ry="24" fill="#22345C" transform="rotate(22 22 86)" />
        <ellipse cx="98" cy="86" rx="9" ry="24" fill="#22345C" transform="rotate(-22 98 86)" />
        <!-- Body -->
        <ellipse cx="60" cy="78" rx="40" ry="52" fill="#2A4170" />
        <!-- Belly -->
        <ellipse cx="60" cy="90" rx="27" ry="37" fill="#F4F8FF" />
        <!-- Face White Patch -->
        <path d="M60 40 C40 40 33 54 36 66 C40 76 52 74 60 70 C68 74 80 76 84 66 C87 54 80 40 60 40 Z" fill="#F4F8FF" />
        <!-- Beanie Hat -->
        <path d="M26 44 C28 18 92 18 94 44 C80 36 40 36 26 44 Z" fill="#6CC4FF" />
        <rect x="24" y="40" width="72" height="9" rx="4.5" fill="#E9F6FF" />
        <circle cx="60" cy="17" r="7" fill="#E9F6FF" />
        <!-- Cheeks -->
        <circle cx="42" cy="66" r="4.5" fill="#FF8FA3" opacity=".6" />
        <circle cx="78" cy="66" r="4.5" fill="#FF8FA3" opacity=".6" />
        <!-- Eyes -->
        <circle cx="49" cy="56" r="5" fill="#0D1526" />
        <circle cx="71" cy="56" r="5" fill="#0D1526" />
        <circle cx="50.8" cy="54.2" r="1.7" fill="#FFF" />
        <circle cx="72.8" cy="54.2" r="1.7" fill="#FFF" />
        <!-- Beak -->
        <path d="M51 64 Q60 76 69 64 Q60 59 51 64 Z" fill="#FF9A3C" />
        <path d="M53 66 Q60 70 67 66" stroke="#C96A1C" stroke-width="1.4" stroke-linecap="round" fill="none" />
      </g>
    </g>

    <!-- Version & Tag Pill -->
    <rect x="45" y="260" width="200" height="36" rx="18" fill="#0D182A" stroke="#2B4673" stroke-width="1.2" />
    <text x="145" y="283" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#6CC4FF" letter-spacing="1.2">
      ALEXEL PENGUIN 🐧 v0.3.0
    </text>
  </g>

  <!-- LEFT SECTION: Branding, AI Agents Pills, Tagline, Cross-Platform -->
  <g transform="translate(75, 65)">
    <!-- Top Pill -->
    <g>
      <rect width="320" height="34" rx="17" fill="#1C2E4F" stroke="#365B96" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#6CC4FF" />
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#CBE7FF" letter-spacing="1.5">
        NEXT-GEN OPEN SOURCE CODE EDITOR
      </text>
    </g>

    <!-- Title & Wordmark -->
    <g transform="translate(0, 82)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', sans-serif" font-size="60" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
        ALEXEL STUDIO
      </text>
    </g>

    <!-- Tagline & Core Philosophy -->
    <g transform="translate(0, 128)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#EBF3FF">
        Code side-by-side with <tspan fill="#6CC4FF">autonomous AI agents.</tspan>
      </text>
      <text y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9DB7DF" font-weight="400">
        Free, open-source IDE for macOS, Windows &amp; Linux with human-in-the-loop review,
      </text>
      <text y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9DB7DF" font-weight="400">
        real integrated terminal, language servers (LSP), and native multi-language debugger (DAP).
      </text>
    </g>

    <!-- Built-in AI Agents Badges Row -->
    <g transform="translate(0, 224)">
      <!-- Claude Code -->
      <g transform="translate(0, 0)">
        <rect width="135" height="36" rx="10" fill="#2E1815" stroke="#D97706" stroke-width="1.2" />
        <circle cx="16" cy="18" r="5" fill="#F59E0B" />
        <text x="28" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FDE68A">Claude Code</text>
      </g>

      <!-- Codex -->
      <g transform="translate(145, 0)">
        <rect width="105" height="36" rx="10" fill="#0E2E20" stroke="#10B981" stroke-width="1.2" />
        <circle cx="16" cy="18" r="5" fill="#10B981" />
        <text x="28" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0">Codex</text>
      </g>

      <!-- Gemini -->
      <g transform="translate(260, 0)">
        <rect width="105" height="36" rx="10" fill="#172554" stroke="#3B82F6" stroke-width="1.2" />
        <circle cx="16" cy="18" r="5" fill="#3B82F6" />
        <text x="28" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#BFDBFE">Gemini</text>
      </g>

      <!-- Antigravity -->
      <g transform="translate(375, 0)">
        <rect width="130" height="36" rx="10" fill="#291A38" stroke="#A855F7" stroke-width="1.2" />
        <circle cx="16" cy="18" r="5" fill="#A855F7" />
        <text x="28" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E9D5FF">Antigravity</text>
      </g>

      <!-- ACP Standard -->
      <g transform="translate(515, 0)">
        <rect width="120" height="36" rx="10" fill="#1E293B" stroke="#64748B" stroke-width="1.2" />
        <circle cx="16" cy="18" r="5" fill="#94A3B8" />
        <text x="28" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">+ Any ACP</text>
      </g>
    </g>

    <!-- Platform Availability Row -->
    <g transform="translate(0, 280)">
      <text y="14" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#7899CC" letter-spacing="1">PLATFORMS:</text>
      <text x="95" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">
         macOS (Apple Silicon &amp; Intel)  ·  ⊞ Windows (x64 / ARM64)  ·  🐧 Linux (.deb / .rpm / .AppImage)
      </text>
    </g>
  </g>
</svg>

name: Release

# Membuat draft rilis GitHub berisi installer macOS, Windows, dan Linux saat tag v* di-push.
# Nama berkas tetap (Alexel-Studio-<os>-<arch>.<ext>) supaya tautan
# releases/latest/download/<berkas> di halaman unduh selalu menunjuk versi terbaru.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Satu draft dibuat dulu. Tiga job build paralel yang sama-sama membuat draft bisa menghasilkan
  # beberapa draft terpisah (berkas Mac pernah nyasar ke draft kedua pada v0.5.0).
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag harus sama dengan versi package.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VER" ]; then
            echo "::error::Tag $TAG tidak sama dengan versi package.json ($VER)"
            exit 1
          fi
      - name: Buat draft rilis bila belum ada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes "Draft otomatis dari CI."
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Paket rpm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      # Installer untuk arsitektur kedua (Intel Mac, Windows ARM64) butuh modul native versi itu juga.
      - name: Modul native arsitektur kedua (macOS)
        if: runner.os == 'macOS'
        run: npm install --no-save --force @parcel/watcher-darwin-x64@2.6.0 @parcel/watcher-darwin-arm64@2.6.0
      - name: Modul native arsitektur kedua (Windows)
        if: runner.os == 'Windows'
        run: npm install --no-save --force @parcel/watcher-win32-arm64@2.6.0 @parcel/watcher-win32-x64@2.6.0
      - name: Alamat repo untuk cek pembaruan
        shell: bash
        run: npm pkg set repository.type=git "repository.url=https://github.com/${GITHUB_REPOSITORY}"
      - run: npm test
      - run: npm run build
      - name: Ripgrep bawaan (pin SHA-256)
        shell: bash
        run: node scripts/ripgrep/fetch.mjs
      - name: Build & unggah ke draft rilis
        # bash juga di Windows: PowerShell memecah argumen -c.publish.* jadi nama berkas.
        shell: bash
        run: npx electron-builder ${{ matrix.target }} --publish always -c.publish.provider=github -c.publish.releaseType=draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pemeriksaan akhir: semua installer harus ada di SATU rilis sebelum dipublikasikan.
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Periksa berkas rilis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          names=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate -q ".[] | select(.tag_name==\"$TAG\") | .assets[].name")
          count_rel=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate -q "[.[] | select(.tag_name==\"$TAG\")] | length")
          echo "Rilis dengan tag $TAG: $count_rel"
          [ "$count_rel" = "1" ] || { echo "::error::Ada $count_rel rilis untuk $TAG (harus 1)"; exit 1; }
          for f in Alexel-Studio-mac-arm64.dmg Alexel-Studio-mac-x64.dmg Alexel-Studio-win-x64.exe Alexel-Studio-win-arm64.exe Alexel-Studio-linux-amd64.deb Alexel-Studio-linux-x86_64.AppImage Alexel-Studio-linux-x86_64.rpm latest-mac.yml latest.yml latest-linux.yml; do
            echo "$names" | grep -qx "$f" || { echo "::error::Berkas $f tidak ada di rilis $TAG"; exit 1; }
          done
          echo "Semua berkas ada. Publikasikan dengan: gh release edit $TAG --draft=false --latest"
